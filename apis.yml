aid: fern-bot
name: Fern Bot
description: >-
  Fern (operating as Ishiki Labs) is a Y Combinator (Winter 2026) physical-AI
  startup building high-fidelity, custom robot world models that let robotics
  companies evaluate and train their robot policies at scale in software. Fern
  provides plug-and-play reinforcement-learning environments generated from a
  foundational world model: robotics teams seed varied starting scenes from
  their production environments, test and improve policies entirely in
  simulation, and Fern generates RL heads on top of existing policies to raise
  speed and success rates — a continual-learning flywheel where production
  robots improve every week. Founded in 2025 by CEO Amit Yadav (ex-Meta LLaMA /
  Reality Labs research scientist) and CTO Robert Xu (ex-Meta Reality Labs and
  Citadel Securities). As of this profile Fern publishes a marketing site, a
  whitepaper, and case studies but no public developer API, SDK, or
  documentation surface.
